[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eidos-cli"
version = "0.1.0"
description = "CLI for the Eidos AGI platform"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
]

[project.scripts]
eidos = "eidos_cli.main:cli"

[tool.setuptools.packages.find]
include = ["eidos_cli*"]
